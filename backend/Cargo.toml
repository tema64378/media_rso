[package]
name = "mediacontest_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.6", features = ["mysql", "runtime-tokio-rustls"] }
dotenv = "0.15"
tower = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
bcrypt = "0.10"
jsonwebtoken = "8"
chrono = { version = "0.4", features = ["serde"] }
